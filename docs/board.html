<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hunt CTF — Board</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="back-link">&larr; Campaigns</a>
    <h1 id="campaign-title">Loading…</h1>
  </header>

  <section class="teams-panel" id="teams-panel">
    <div class="teams-controls">
      <input type="text" id="new-team-name" placeholder="Team name">
      <button id="add-team-btn">Add Team</button>
    </div>
    <div class="teams-scores" id="teams-scores"></div>
  </section>

  <main>
    <table class="board" id="board-table">
      <thead id="board-head"></thead>
      <tbody id="board-body"></tbody>
    </table>
  </main>

  <section class="summary-panel">
    <button id="show-summary-btn">Show Maturity Summary</button>
    <div id="summary-output"></div>
  </section>

  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal modal-wide">
      <div class="modal-category" id="modal-category"></div>
      <div class="modal-points" id="modal-points"></div>
      <div class="modal-tasks" id="modal-tasks"></div>
      <button class="modal-close" id="modal-close-btn">Close</button>
    </div>
  </div>

  <script src="assets/js/board.js"></script>
</body>
</html>
